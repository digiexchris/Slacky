name: Release Desktop App

on: pull_request
  push:
    branches:
      - main

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    # container:
    #   image: bilelmoussaoui/flatpak-github-actions:gnome-44
    #   options: --privileged
    steps:
      - name: Install flatpak runtime
        run: |
          flatpak install --no-deps --arch aarch64 --assumeyes runtime/org.freedesktop.Platform/aarch64/25.08
          flatpak install --no-deps --arch aarch64 --assumeyes runtime/org.freedesktop.Sdk/aarch64/25.08
          flatpak install --no-deps --arch aarch64 --assumeyes org.electronjs.Electron2.BaseApp/aarch64/25.08

      - name: Check out Git repository
        uses: actions/checkout@v3

      # Dont use cache as we never re-run this job
      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Bun enviroment
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Build App
        run: bun run build

      - name: Sign, Notarize and Release new Version
        run: bun run publish
        env:
          # Github token to release the app and upload assets to streamline-releases repo
          GITHUB_TOKEN: ${{ secrets.gh_token }}

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: slacky.flatpak
          manifest-path: flatpak/com.andersonlaverde.slacky.yml
          cache-key: flatpak-builder-${{ github.sha }}
          
      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: slacky-flatpak-release
          path: slacky.flatpak

      # - name: Publish to Flathub
      #   uses: flatpak/flatpak-github-actions/flathub-publish@v6
      #   with:
      #     app-id: com.andersonlaverde.slacky
      #     bundle: slacky.flatpak
      #     flathub-token: ${{ secrets.FLATHUB_TOKEN }}
