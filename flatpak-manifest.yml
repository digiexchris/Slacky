app-id: com.andersonlaverde.slacky
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
command: slacky
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=fallback-x11 #allow x11 fallback
  - --socket=wayland #enable wayland by default
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.Unity
  - --own-name=org.kde.StatusNotifierItem-*
  - --talk-name=com.canonical.AppMenu.Registrar
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons #enable proper cursor scaling on HiDPI displays
modules:
  # - name: nodejs
  #   buildsystem: simple
  #   build-commands:
  #     - mkdir -p /app/node
  #     - cp -ra . /app/node
  #   sources:
  #     - type: archive
  #       url: https://nodejs.org/dist/v24.11.0/node-v24.11.0-linux-x64.tar.xz
  #       sha256: [SHA256_HASH]
  #       dest: .
  #   cleanup:
  #     - /node/include
  #     - /node/share
  #     - /node/lib/node_modules/npm/man
  #     - /node/lib/node_modules/npm/docs
  - name: slacky
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node24/bin
      build-args:
        - --share=network
      env:
        NPM_CONFIG_LOGLEVEL: DEBUG
        # YARN_CACHE_FOLDER: /run/build/slacky/.yarn-cache
        # YARN_GLOBAL_FOLDER: /run/build/slacky/.yarn-global
        # HOME: /run/build/slacky
        npm_config_nodedir: /usr/lib/sdk/node24
        DEBUG: "@malept/flatpak-bundler" 
      arch:
        aarch64:
          env:
            npm_config_target_arch: arm64
            npm_config_target_platform: linux
            npm_config_target_arch_family: arm64
    build-commands:
      #Install dependencies
      - npm install --prefix=slacky --offline
      - cp -r slacky /app
      - install -Dm 755 run.sh /app/bin/slacky

      # # Build the TypeScript source
      # - |
      #   echo "Building Slacky..."
      #   # export PATH="./node_modules/.bin:$PATH"
      #   # echo $PATH
      #   # ls `pwd`
      #   which npm
      #   /usr/lib/sdk/node24/bin/npm --version 2>&1
      #   # swc src -d dist/app

      # # Install the app to /app/main/
      # - mkdir -p /app/main
      # - cp -r dist /app/main/
      # - cp -r node_modules /app/main/
      # - cp package.json /app/main/

      # # Install icons
      # - install -Dm644 build/icons/icon.png /app/share/icons/hicolor/512x512/apps/com.andersonlaverde.slacky.png

      # # Install desktop file
      # - install -Dm644 com.andersonlaverde.slacky.desktop /app/share/applications/com.andersonlaverde.slacky.desktop

      # # Install metainfo
      # - install -Dm644 com.andersonlaverde.slacky.metainfo.xml /app/share/metainfo/com.andersonlaverde.slacky.metainfo.xml

      # # Install wrapper script
      # - install -Dm755 run.sh /app/bin/slacky
    sources:
      - type: dir
        path: ./dist/
        dest: slacky
      - type: dir
        path: ./node_modules/
        dest: slacky/node_modules
      - type: dir
        path: ./build/icons
        dest: icons
      - generated_sources.json
      - type: script
        dest-filename: run.sh
        commands:
          - export PATH=$PATH:/app/node/bin
          # We need to wrap the main binary with Zypak in order for sandboxing
          # to work. Without this, we'll get errors about the "SUID sandbox
          # helper binary".
          - |
            zypak-wrapper \
              /app/electron-quick-start/node_modules/electron/dist/electron \
              /app/electron-quick-start
